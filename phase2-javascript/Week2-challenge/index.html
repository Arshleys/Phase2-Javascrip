<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>pesa haraka</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <main>
      <h1>Welcome to Pesa Haraka</h1>
      <p1>This is a Fast,and the most Reliable means of Transaction</p1>

      <form id="transactionForm" novalidate>
        <div class="field">
          <label for="fullName">Full name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            autocomplete="name"
          />
          <p class="error" id="fullNameError"></p>
        </div>

        <div class="field">
          <label for="phone">Phone number</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="0712 345 678"
          />
          <p class="error" id="phoneError"></p>
        </div>

        <div class="field">
          <label for="transactionType">Transaction type</label>
          <select id="transactionType" name="transactionType">
            <option value="send">Send money</option>
            <option value="withdraw">Withdraw cash</option>
            <option value="business">Pay a business</option>
          </select>
        </div>

        <div class="field">
          <label for="amount">Amount (KSh)</label>
          <input type="text" id="amount" name="amount" inputmode="numeric" />
          <p class="error" id="amountError"></p>
          <p id="feePreview">Enter an amount to see the fee.</p>
        </div>

        <button type="submit">Confirm</button>
      </form>

      <section id="receipt" class="receipt" hidden>
        <h2>Pesa Haraka receipt</h2>
        <dl id="receiptDetails"></dl>
        <button type="button" id="newTransaction">New transaction</button>
      </section>
    </main>
  </body>
</html>
